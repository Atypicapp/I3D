name: Actualizar fuente

# - Al publicar una Release con un .ipa: añade esa versión a fuente.json.
# - Al subir o borrar imágenes en capturas/ o imagenes/: actualiza las
#   capturas, la cabecera y las imágenes de las noticias.
# SideStore lee fuente.json y lo muestra todo.
on:
  release:
    types: [published, edited]
  push:
    branches: [main]
    paths:
      - "capturas/**"
      - "imagenes/**"
  workflow_dispatch:

permissions:
  contents: write

# Al publicar, GitHub a veces lanza el proceso dos veces seguidas: así se
# ejecutan de una en una y la segunda ve que ya está hecho.
concurrency:
  group: actualizar-fuente
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Añadir la versión a fuente.json
        if: github.event_name == 'release'
        run: python3 .github/scripts/actualizar_fuente.py

      - name: Capturas, cabecera y noticias
        run: python3 .github/scripts/actualizar_capturas.py

      - name: Guardar el cambio
        run: |
          if git diff --quiet; then
            echo "Todo estaba al día."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fuente.json README.md
          if [ "${{ github.event_name }}" = "release" ]; then
            git commit -m "Fuente: versión ${{ github.event.release.tag_name }}"
          else
            git commit -m "Fuente: capturas e imágenes"
          fi
          git pull --rebase origin main
          git push
